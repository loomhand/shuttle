[package]
name = "shuttle"
description = "A local computer-use host: agents drive this desktop over MCP stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cocoon-shuttle"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shuttle-desk = { path = "../desk" }
shuttle-desk-core = { path = "../desk-core" }
shuttle-models = { path = "../models" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-std", "io-util", "macros", "process", "signal", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDate", "NSObject", "NSRunLoop", "NSString", "NSTimer", "block2"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt"] }

[lints]
workspace = true

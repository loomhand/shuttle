[package]
name = "shuttle"
description = "A local computer-use host: agents drive this desktop over MCP stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cocoon-shuttle"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shuttle-desk = { path = "../desk" }
shuttle-desk-core = { path = "../desk-core" }
shuttle-models = { path = "../models" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-std", "io-util", "process", "sync", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "net", "rt"] }

[lints]
workspace = true

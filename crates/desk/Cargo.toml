[package]
name = "shuttle-desk"
description = "The desk verbs over the macOS, Windows and Linux accessibility trees, with input through cua-driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shuttle-desk-core = { path = "../desk-core" }
tokio = { version = "1", features = ["fs", "rt", "net", "io-util", "sync", "time"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
image-webp = "0.2.4"
jpeg-encoder = "0.7.1"
tokio = { version = "1", features = ["macros"] }
x11rb = { version = "0.14", features = ["shm", "shape", "xinput", "xkb", "xtest"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true

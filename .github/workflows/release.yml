name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: The tag names the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME but Cargo.toml says $version: bump the version in a release commit before tagging"
            exit 1
          fi

      - name: The tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main: tag a release commit on main"
            exit 1
          fi

      - name: The changelog has notes for the version
        run: |
          if ! awk -v v="${GITHUB_REF_NAME#v}" '/^## / { on = ($2 == v) } on && !/^## /' CHANGELOG.md | grep -q '[^[:space:]]'; then
            echo "::error::CHANGELOG.md has no notes under a \"## ${GITHUB_REF_NAME#v}\" heading: add them in the release commit before tagging"
            exit 1
          fi

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  ui-jar:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS

      - name: Build the UI server jar
        run: |
          bash android/ui/build.sh shuttle-ui.jar
          unzip -l shuttle-ui.jar | grep -q classes.dex
          sha256sum shuttle-ui.jar

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shuttle-ui-jar
          path: shuttle-ui.jar

  build:
    needs: [ui-jar, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-26
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          # Debian 11 keeps the glibc floor at 2.31, the floor of the bundled cua-driver.
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: debian:11
            rustup-sha256: 5be191e8c70a5007074254cb74d78dbfdd25cd5a61c27de7b8e5410122ec24f4
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:11
            rustup-sha256: a9c168dbea81a84671c6b7a5c1795cb0eb699020110d107ddfca427bd797e697
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    steps:
      - name: Debian build dependencies
        if: matrix.container
        run: |
          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://snapshot.debian.org/archive/debian/20260901T000000Z/ bullseye main
          deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://snapshot.debian.org/archive/debian/20260901T000000Z/ bullseye-updates main
          deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://snapshot.debian.org/archive/debian-security/20260901T000000Z/ bullseye-security main
          APT
          apt-get -o Dir::Etc::sourceparts=- -o Acquire::Retries=5 update
          apt-get -o Dir::Etc::sourceparts=- -o Acquire::Retries=5 install -y --no-install-recommends \
            git ca-certificates curl build-essential xz-utils
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/rustup-init" "https://static.rust-lang.org/rustup/archive/1.29.2/${{ matrix.target }}/rustup-init"
          echo "${{ matrix.rustup-sha256 }}  $RUNNER_TEMP/rustup-init" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/rustup-init"
          "$RUNNER_TEMP/rustup-init" -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build
        shell: bash
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -t ${{ matrix.target }}
          cargo build --release --locked -p shuttle --target ${{ matrix.target }}

      - name: UI server jar
        if: startsWith(matrix.platform, 'linux-')
        uses: actions/download-artifact@v8.0.2
        with:
          name: shuttle-ui-jar
          path: ui

      - name: Package
        shell: bash
        env:
          UI_JAR: ui/shuttle-ui.jar
        run: packaging/package.sh ${{ matrix.platform }} target/${{ matrix.target }}/release "$GITHUB_REF_NAME" dist

      - name: No Visual C++ runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/*.zip).FullName -DestinationPath crt
          packaging/crt.ps1 (Get-ChildItem crt -Recurse -Filter *.exe).FullName

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Installers and checksums
        run: |
          cp packaging/install.sh packaging/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## / { on = ($2 == v) } on && !/^## /' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "shuttle $GITHUB_REF_NAME" --notes-file notes.md

  install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: ubuntu:22.04
          - runner: ubuntu-24.04-arm
            container: ubuntu:24.04
          - runner: macos-26
          - runner: macos-15-intel
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Prerequisites
        if: matrix.container
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates

      - name: Install
        if: runner.os != 'Windows'
        run: curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" | SHUTTLE_VERSION="$GITHUB_REF_NAME" sh

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SHUTTLE_VERSION = $env:GITHUB_REF_NAME
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1" | iex
          "$env:LOCALAPPDATA\Programs\loomhand\shuttle" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Status over MCP
        shell: bash
        run: |
          [ "$RUNNER_OS" = Windows ] || export PATH="$HOME/.local/bin:$PATH"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"status","arguments":{}}}' | shuttle mcp | tee status.json
          grep -F "\\\"version\\\":\\\"${GITHUB_REF_NAME#v}\\\"" status.json

  promote:
    needs: install
    runs-on: ubuntu-24.04
    concurrency:
      group: release-promote
    permissions:
      contents: write
    steps:
      - name: Mark the release as the latest unless a newer one is out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$({ echo "$GITHUB_REF_NAME"; gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName'; } | sort -V | tail -1)
          latest=false
          [ "$newest" != "$GITHUB_REF_NAME" ] || latest=true
          gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --prerelease=false --latest="$latest"

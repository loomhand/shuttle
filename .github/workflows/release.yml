name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ui-jar:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101

      - name: Build the UI server jar twice
        run: |
          bash android/ui/build.sh cb-ui.jar
          bash android/ui/build.sh "$RUNNER_TEMP/again.jar"
          unzip -l cb-ui.jar | grep -q classes.dex
          sha256sum cb-ui.jar "$RUNNER_TEMP/again.jar"
          cmp cb-ui.jar "$RUNNER_TEMP/again.jar"

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cb-ui-jar
          path: cb-ui.jar

  build:
    needs: ui-jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-26
            target: aarch64-apple-darwin
          - platform: macos-x64
            runner: macos-26
            target: x86_64-apple-darwin
          - platform: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          # Debian 11 keeps the glibc floor at 2.31, the floor of the bundled cua-driver.
          - platform: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            container: debian:11
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            container: debian:11
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    steps:
      - name: Debian build dependencies
        if: matrix.container
        run: |
          cat > /etc/apt/sources.list <<'APT'
          deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://snapshot.debian.org/archive/debian/20260901T000000Z/ bullseye main
          deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://snapshot.debian.org/archive/debian/20260901T000000Z/ bullseye-updates main
          deb [check-valid-until=no signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] http://snapshot.debian.org/archive/debian-security/20260901T000000Z/ bullseye-security main
          APT
          apt-get -o Dir::Etc::sourceparts=- -o Acquire::Retries=5 update
          apt-get -o Dir::Etc::sourceparts=- -o Acquire::Retries=5 install -y --no-install-recommends \
            git ca-certificates curl build-essential xz-utils
          curl -fsSL --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build
        shell: bash
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -t ${{ matrix.target }}
          cargo build --release --locked -p shuttle --target ${{ matrix.target }}

      - name: UI server jar
        if: startsWith(matrix.platform, 'linux-')
        uses: actions/download-artifact@v8.0.2
        with:
          name: cb-ui-jar
          path: ui

      - name: Package
        shell: bash
        env:
          UI_JAR: ui/cb-ui.jar
        run: packaging/package.sh ${{ matrix.platform }} target/${{ matrix.target }}/release "$GITHUB_REF_NAME" dist

      - name: No Visual C++ runtime imports
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path (Get-Item dist/*.zip).FullName -DestinationPath crt
          packaging/crt.ps1 (Get-ChildItem crt -Recurse -Filter *.exe).FullName

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Download
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Installers and checksums
        run: |
          cp packaging/install.sh packaging/install.ps1 dist/
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Provenance
        uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: dist/*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '/^## / { on = ($2 == v) } on && !/^## /' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --prerelease --title "shuttle $GITHUB_REF_NAME" --notes-file notes.md

  install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: ubuntu:22.04
          - runner: ubuntu-24.04-arm
            container: ubuntu:24.04
          - runner: macos-26
          - runner: macos-15-intel
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - name: Prerequisites
        if: matrix.container
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates

      - name: Install
        if: runner.os != 'Windows'
        run: curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/install.sh" | SHUTTLE_VERSION="$GITHUB_REF_NAME" sh

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:SHUTTLE_VERSION = $env:GITHUB_REF_NAME
          irm "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/install.ps1" | iex
          "$env:LOCALAPPDATA\Programs\cocoon-shuttle" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Status over MCP
        shell: bash
        run: |
          [ "$RUNNER_OS" = Windows ] || export PATH="$HOME/.local/bin:$PATH"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"status","arguments":{}}}' | cocoon-shuttle mcp | tee status.json
          grep -F "\\\"version\\\":\\\"${GITHUB_REF_NAME#v}\\\"" status.json

  promote:
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Mark the release as the latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --prerelease=false --latest

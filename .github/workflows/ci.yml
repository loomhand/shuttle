name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt -c clippy

      - name: Format
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Shellcheck
        run: |
          shellcheck -s sh packaging/install.sh
          shellcheck packaging/package.sh packaging/fetch.sh

      - name: Node from packaging/pins
        run: echo "$(packaging/fetch.sh linux-x64 node "$RUNNER_TEMP")/bin" >> "$GITHUB_PATH"

      - name: Typecheck
        working-directory: runtime
        run: npm ci --no-audit --no-fund && npm run typecheck

      # the Linux flows directory of gui_plan is /workspace/flows
      - name: Test
        run: |
          sudo install -d -o "$USER" /workspace
          node --version
          node --test runtime/test/*.test.mts

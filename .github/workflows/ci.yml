name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            bin: bin
          - runner: macos-26
            platform: macos-arm64
            bin: bin
          - runner: macos-15-intel
            platform: macos-x64
            bin: bin
          - runner: windows-2025
            platform: windows-x64
            bin: .
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node from packaging/pins
        shell: bash
        run: |
          dir=$(packaging/fetch.sh ${{ matrix.platform }} node "$RUNNER_TEMP")
          echo "$dir/${{ matrix.bin }}" >> "$GITHUB_PATH"

      - name: Toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt -c clippy

      - name: Format
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: No Visual C++ runtime imports
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p shuttle
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          packaging/crt.ps1 target/release/shuttle.exe

      - name: Upload the Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shuttle-windows-x64
          path: target/release/shuttle.exe
          retention-days: 7

  advisories:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

      - name: cargo-deny
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/cargo-deny.tar.gz" https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $RUNNER_TEMP/cargo-deny.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/cargo-deny"
          tar -xzf "$RUNNER_TEMP/cargo-deny.tar.gz" -C "$RUNNER_TEMP/cargo-deny" --strip-components=1
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"

      - name: Advisories
        run: cargo deny --locked check advisories

  android-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS

      - name: Build the UI server jar twice
        run: |
          shellcheck android/ui/build.sh
          bash android/ui/build.sh "$RUNNER_TEMP/shuttle-ui.jar"
          bash android/ui/build.sh "$RUNNER_TEMP/again.jar"
          unzip -l "$RUNNER_TEMP/shuttle-ui.jar" | grep -q classes.dex
          sha256sum "$RUNNER_TEMP/shuttle-ui.jar" "$RUNNER_TEMP/again.jar"
          cmp "$RUNNER_TEMP/shuttle-ui.jar" "$RUNNER_TEMP/again.jar"

  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            bin: bin
          - runner: macos-26
            platform: macos-arm64
            bin: bin
          - runner: windows-2025
            platform: windows-x64
            bin: .
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Shellcheck
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          shellcheck -s sh packaging/install.sh
          shellcheck packaging/package.sh packaging/fetch.sh

      - name: Node from packaging/pins
        run: |
          dir=$(packaging/fetch.sh ${{ matrix.platform }} node "$RUNNER_TEMP")
          echo "$dir/${{ matrix.bin }}" >> "$GITHUB_PATH"

      - name: Typecheck
        if: matrix.runner == 'ubuntu-24.04'
        working-directory: runtime
        run: npm ci --no-audit --no-fund && npm run typecheck

      - name: Test
        run: |
          node --version
          node --test runtime/test/*.test.mts

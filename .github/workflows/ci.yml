name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-26, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal -c rustfmt -c clippy

      - name: Format
        if: matrix.runner == 'ubuntu-24.04'
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: No Visual C++ runtime imports
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked -p shuttle
          packaging/crt.ps1 target/release/shuttle.exe

      - name: Upload the Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: shuttle-windows-x64
          path: target/release/shuttle.exe
          retention-days: 7

  android-ui:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: JDK
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: 21.0.12+101.0.LTS

      - name: Build the UI server jar twice
        run: |
          shellcheck android/ui/build.sh
          bash android/ui/build.sh "$RUNNER_TEMP/shuttle-ui.jar"
          bash android/ui/build.sh "$RUNNER_TEMP/again.jar"
          unzip -l "$RUNNER_TEMP/shuttle-ui.jar" | grep -q classes.dex
          sha256sum "$RUNNER_TEMP/shuttle-ui.jar" "$RUNNER_TEMP/again.jar"
          cmp "$RUNNER_TEMP/shuttle-ui.jar" "$RUNNER_TEMP/again.jar"

  runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            bin: bin
          - runner: macos-26
            platform: macos-arm64
            bin: bin
          - runner: windows-2025
            platform: windows-x64
            bin: .
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Shellcheck
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          shellcheck -s sh packaging/install.sh
          shellcheck packaging/package.sh packaging/fetch.sh

      - name: Node from packaging/pins
        run: echo "$(packaging/fetch.sh ${{ matrix.platform }} node "$RUNNER_TEMP")/${{ matrix.bin }}" >> "$GITHUB_PATH"

      - name: Typecheck
        working-directory: runtime
        run: npm ci --no-audit --no-fund && npm run typecheck

      - name: Test
        run: |
          node --version
          node --test runtime/test/*.test.mts
